
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Trattoria</title>

    <!-- Tipografía del logo y los titulos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS e iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link href="css/estilos.css" rel="stylesheet">
</head>

<body class="bg-body-tertiary">

    <!-- Contenedor donde funciona Vue -->
    <div id="app" class="d-flex flex-column min-vh-100">

        <!-- Cabecera con el menú de navegación (componente) -->
        <mi-header
            :vista-actual="vistaActual"
            :cantidad-pedido="cantidadItems"
            @cambiar-vista="mostrarVista">
        </mi-header>

        <main class="flex-grow-1">

            <!-- Vista 1: Inicio -->
            <div v-show="vista_inicio">
                <vista-inicio
                    :destacados="platosDestacados"
                    @agregar="agregarAlPedido"
                    @ir-a="mostrarVista">
                </vista-inicio>
            </div>

            <!-- Vista 2: Menú -->
            <div v-show="vista_menu">
                <vista-menu
                    :platos="platos"
                    @agregar="agregarAlPedido">
                </vista-menu>
            </div>

            <!-- Vista 3: Mi pedido -->
            <div v-show="vista_pedido">
                <vista-pedido
                    :pedido="pedido"
                    :total="totalPedido"
                    @cambiar-cantidad="cambiarCantidad"
                    @quitar="quitarDelPedido"
                    @confirmar="confirmarPedido"
                    @ir-a="mostrarVista">
                </vista-pedido>
            </div>

            <!-- Vista 4: Reservas -->
            <div v-show="vista_reservas">
                <vista-reservas
                    :reservas="reservas"
                    @reservar="confirmarReserva">
                </vista-reservas>
            </div>

            <!-- Vista 5: Sobre nosotros -->
            <div v-show="vista_nosotros">
                <vista-nosotros></vista-nosotros>
            </div>

        </main>

        <!----------------footer------------------->
        <mi-footer></mi-footer>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CDN de Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Componentes -->
    <script src="js/componentes.js"></script>

    <!----------------- App principal-------- -->
    <script src="js/script.js"></script>
</body>
</html>
